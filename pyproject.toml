[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pddlpy"
version = "1.2.2"
description = "Python PDDL parser"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Hernan Foffani", email = "hfoffani@gmail.com"}
]
keywords = ["pddl", "planning", "parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
# None: the ANTLR runtime is vendored in pddlpy/_vendor/ (#148).
dependencies = []

[project.scripts]
pddlpy = "pddlpy.cli:main"
pddlpy-mcp = "pddlpy.mcpserver:main"

[project.urls]
Homepage = "https://github.com/hfoffani/pddl-lib"
Repository = "https://github.com/hfoffani/pddl-lib"
Issues = "https://github.com/hfoffani/pddl-lib/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.30,<2",
]

[tool.hatch.build]
exclude = [
    "tmp/",
    "*.jar",
    ".github/",
    ".vscode/",
    ".claude/",
    "examples-pddl/",
    ".venv/",
    "__pycache__/",
    "*.pyc",
    # ANTLR tool side-outputs; the Python parser does not read them.
    "pddlpy/*.interp",
    "pddlpy/*.tokens",
]

# sdist-only: at the build level this list also put these top-level files
# in the wheel root, i.e. directly into site-packages
[tool.hatch.build.targets.sdist]
only-include = [
    "pddlpy/",
    "README.md",
    "LICENSE.txt",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["pddlpy"]

# Include example PDDL files as data files
[tool.hatch.build.targets.wheel.shared-data]
"examples-pddl" = "share/pddlpy/examples"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mcp>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["pddlpy", "tests"]
python_files = ["test.py", "test_*.py"]

[tool.coverage.run]
source = ["pddlpy"]
omit = [
    "pddlpy/pddlLexer.py",
    "pddlpy/pddlParser.py",
    "pddlpy/pddlListener.py",
    "pddlpy/_vendor/*",
    "pddlpy/test.py",
]

# Generated ANTLR parser files and the vendored runtime are not ours —
# exclude them from linting and type checking everywhere.
[tool.ruff]
line-length = 100
extend-exclude = [
    "pddlpy/pddlLexer.py",
    "pddlpy/pddlParser.py",
    "pddlpy/pddlListener.py",
    "pddlpy/_vendor/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line length) is noisy on the existing model code; the formatter
# handles wrapping when desired.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["pddlpy"]
# Generated parser files and the vendored runtime are excluded from type
# checking.
exclude = '((pddlLexer|pddlParser|pddlListener)\.py$|_vendor/)'

# The planning layer is fully typed; hold it to a higher standard.
[[tool.mypy.overrides]]
module = "pddlpy.planning.*"
disallow_untyped_defs = true
warn_return_any = true
