name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # No Java here on purpose (#148): the generated parser is committed and
  # the ANTLR runtime is vendored, so the tests must run without it.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Tests
        run: make test
      - name: Coverage gate (100%)
        run: uv run pytest -q --cov=pddlpy --cov-fail-under=100 --cov-report=term --cov-report=xml
      # One upload per run: the newest Python. The gate above is the check;
      # Codecov is the report, so its outages never fail CI.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        # third-party action that receives a secret: pinned to a commit
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck

  # Java job: compile and exercise the grammar, then regenerate the Python
  # parser from pddl.g4 and fail if it differs from the committed files.
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Grammar test
        run: make testgrammar
      - name: Regenerate parser
        run: make pyparser
      - name: Committed parser matches pddl.g4
        run: |
          git status --porcelain pddlpy
          git diff --exit-code pddlpy
          test -z "$(git status --porcelain pddlpy)"
