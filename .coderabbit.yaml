# CodeRabbit review settings. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target feature branches, not only main.
    base_branches:
      - ".*"
  path_filters:
    # Vendored ANTLR runtime and generated parser: not hand-written, CI checks drift.
    - "!pddlpy/_vendor/**"
    - "!pddlpy/pddlLexer.py"
    - "!pddlpy/pddlParser.py"
    - "!pddlpy/pddlListener.py"
    - "!pddlpy/*.interp"
    - "!pddlpy/*.tokens"
    # IPC subset, its golden files and plan fixtures: regenerated by `make golden`.
    - "!tests/corpus/ipc/**"
    - "!uv.lock"
  path_instructions:
    - path: "pddlpy/planning/**"
      instructions: >-
        Must never import the grammar (pddlpy.pddlParser/Lexer/Listener or the
        ANTLR runtime); tests/test_layering.py enforces it. Flag any claim of
        optimality, unsolvability or completeness that the search does not
        guarantee: verdicts must not say more than the code proves.
    - path: "pddlpy/**/*.py"
      instructions: >-
        Zero runtime dependencies: the ANTLR runtime is imported as
        pddlpy._vendor.antlr4, never antlr4. Python 3.11+. Public API
        (DomainProblem and its object model) is stable through 1.x; JSON output
        changes must be additive.
    - path: "tests/**"
      instructions: >-
        The CI gate requires 100% coverage. Prefer pytest-style tests;
        pddlpy/test.py is legacy unittest.
  tools:
    ruff:
      enabled: true
      config_file: pyproject.toml
chat:
  auto_reply: true
